[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slice-probe"
version = "0.1.0"
description = "Compact frozen-language-model features for answer correctness prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Manmit Singh"}]
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3"]

[project.optional-dependencies]
models = ["transformers==5.9.0", "huggingface-hub==1.16.1", "tokenizers==0.22.2"]
data = ["datasets>=3,<5"]
verify = ["math-verify==0.9.0", "latex2sympy2_extended==1.11.0", "antlr4-python3-runtime==4.13.2", "sympy==1.14.0", "mpmath==1.3.0"]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/SupremeSingh/SLICE"

[project.scripts]
slice-probe = "slice_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
slice_probe = ["sample_answers.jsonl"]
