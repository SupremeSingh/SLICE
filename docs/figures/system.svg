<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
<title>SLICE: vertical system overview for a poster column</title>
<desc>A question and available answer prefix enter a frozen transformer. Five schematic layer sheets contribute their last-prefix-token hidden states. These states are normalized and combined into 7680 coordinates, compressed to 768 features, and passed to a linear Ridge readout to produce an eventual-correctness score. LLM and compressor weights remain frozen during prediction.</desc>
