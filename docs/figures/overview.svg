<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
<title>SLICE: a compact readout of frozen transformer states</title>
<desc>A question and available answer prefix enter a frozen transformer, drawn as five schematic flat layer sheets. Hidden states at the last prefix token from five selected depths are normalized and concatenated. A learned frozen projection and ReLU compress 7680 coordinates into 768 features. A Ridge linear readout yields an eventual final-answer correctness score. No future answer tokens are supplied.</desc>
